name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A real Redis, not mocked - so the cache package's integration tests
    # (cache/middleware_test.go) actually run in CI instead of skipping,
    # same as the local docker-compose flow.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test (SQLite default path + real-Redis cache integration tests)
        env:
          REDIS_ADDR: localhost:6379
        run: go test ./... -race -coverprofile=coverage.out

      - name: coverage summary
        run: go tool cover -func=coverage.out

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (not pushed - just proving the Dockerfile still builds)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: conduit-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: conduit-backend:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
